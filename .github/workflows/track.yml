name: track-upstream
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api repos/Excelsus4/sfumato/commits/main --jq .sha)
          F=.claude-plugin/marketplace.json
          jq --arg s "$SHA" '(.plugins[] | select(.name=="sfumato") | .source.sha) = $s' $F > tmp && mv tmp $F
          git diff --quiet && exit 0
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "sfumato -> ${SHA:0:7}"
          git push
