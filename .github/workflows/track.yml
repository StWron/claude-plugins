name: track-upstream
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=.claude-plugin/marketplace.json
          for repo in $(jq -r '.plugins[] | select(.source.source=="github") | .source.repo' $F); do
            SHA=$(gh api repos/$repo/commits/HEAD --jq .sha)
            jq --arg r "$repo" --arg s "$SHA" '(.plugins[] | select(.source.repo==$r) | .source.sha) = $s' $F > tmp && mv tmp $F
          done
          git diff --quiet && exit 0
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "Track upstream plugins"
          git push
